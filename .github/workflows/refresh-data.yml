name: refresh-data
# Mỗi ngày thu thập lại dữ liệu trên Postgres tạm, chạy dbt, xuất snapshot và commit.
# Streamlit Cloud thấy commit mới thì tự nạp lại dashboard.
on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC = 09:00 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: tourism, POSTGRES_PASSWORD: tourism, POSTGRES_DB: tourism}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tourism" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: tourism
      PGPASSWORD: tourism
      PGDATABASE: tourism
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt dbt-postgres==1.9.0 pandas sqlalchemy pyarrow
      - name: Khởi tạo schema
        run: psql -f sql/init/02_raw_schema.sql
      # Postgres tạm không giữ lịch sử giữa các lần chạy nên mỗi lần lấy lại toàn bộ: 460 ngày Wikipedia, 8 tuần số bài báo.
      - name: Thu thập dữ liệu
        run: |
          python -m tourism.cli load-places
          python -m tourism.cli news
          python -m tourism.cli mentions
          python -m tourism.cli wiki --days 460
          python -m tourism.cli gnews --days 56
          python -m tourism.cli weather
      - name: dbt run và test
        run: |
          dbt run  --project-dir dbt --profiles-dir dbt
          dbt test --project-dir dbt --profiles-dir dbt
      - name: Xuất snapshot
        run: python scripts/export_snapshot.py
      - name: Commit nếu dữ liệu đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/snapshot
          git diff --cached --quiet && echo "Không có thay đổi" && exit 0
          git commit -m "Cập nhật dữ liệu dashboard $(date -u +%F)"
          git push
      - name: Mở issue báo lỗi nếu cập nhật thất bại
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Cập nhật dữ liệu thất bại $(date -u +%F)"             --body "Workflow refresh-data lỗi: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Dashboard vẫn hiện dữ liệu lần cập nhật trước." || true
